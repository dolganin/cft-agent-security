schema_version: benchmark.protocol.v2
dataset_id: juice-shop-v20.2.0-v2
dataset_version: '2'
ground_truth_status: pending_A02_A03_A04
target_name: OWASP Juice Shop v20.2.0
target_commit: 5658473cf8814459bf89000ce373b20ed0b4eb37
scope: Non-exhaustive independently reviewed positive root causes and explicitly labeled negative controls
  at the pinned commit. Evaluate development/holdout and original/patched/synthetic slices separately;
  no claim of full Juice Shop recall or production generalization. Corpus is pending A02/A03 and freeze
  A04.
slices:
- original
- patched
- synthetic
case_unit:
  unit: independent_security_root_cause
  group_field: independence_group
  positive_limit_per_group_and_slice: 1
  max_tp_per_case: 1
  max_primary_cases_per_finding: 1
  anchors:
  - source
  - http
  - caller_helper
  variants: same_group_separate_original_patched_synthetic_slices
  duplicates: extra_compatible_findings_never_extra_tp
matching: reuse_v1_normalized_file_inclusive_range_family_declared_service_maximum_matching
matching_extensions: review_explicit_anchors_before_A04_no_new_matcher_in_A01
line_tolerance: 0
detection_counts:
- detection_tp
- detection_fp
- detection_fn
- detection_tn
negative_universe: explicit_labeled_controls_only_tn_otherwise_null
verdicts:
  decided:
  - confirmed
  - rejected
  evidence: matching_verdict_high_or_medium_persisted_execution_and_audit
  conflicts: inconclusive_preserve_all_evidence
  missing_detection: not_detected_abstention_never_rejected
  unbacked_decision: invalid_evidence_abstention
  abstentions:
  - inconclusive
  - unsupported
  - timeout
  - policy_blocked
  - technical_error
  - not_detected
  - not_run
  - invalid_evidence
  - conflicting_evidence
  reason_selection: primary_observation_unless_valid_duplicate_decides
  unknown: outside_ground_truth_or_unreviewed_excluded_retained_counted
  run_invalid: TECHNICALLY_INVALID_excluded_from_security_metrics
  run_invalid_examples:
  - docker_unavailable
  - target_start_failed
  - required_provider_fully_unavailable
  - corrupted_artifacts
  - benchmark_configuration_mismatch
  case_error: abstention_no_runtime_error_as_detection_fn
metrics:
  confirmed_precision:
    layer: verification
    numerator: correct_confirmations
    denominator: confirmed_cases
    undefined: 'null'
    note: Distinct correctly evidence-confirmed positives / all distinct evidence-confirmed labeled cases;
      unknown findings excluded.
  supported_verified_recall:
    layer: verification
    numerator: correct_confirmations
    denominator: positive_cases
    undefined: 'null'
    note: All labeled positives in the evaluated scope remain in the denominator, including unsupported
      or undetected positives; supported names the numerator, not a smaller supported-only denominator.
  false_confirmation_rate:
    layer: verification
    numerator: false_confirmations
    denominator: negative_cases
    undefined: 'null'
    note: False confirmations / all labeled negative controls; no controls means N/A.
  answered_accuracy:
    layer: verification
    numerator: correct_decisions
    denominator: decided_cases
    undefined: 'null'
    note: Correct positive confirmations plus correct negative rejections / all cases with a valid evidence-backed
      binary decision.
  decision_coverage:
    layer: verification
    numerator: decided_cases
    denominator: labeled_cases
    undefined: 'null'
    note: Distinct valid evidence-backed binary decisions / all labeled cases.
  abstention_rate:
    layer: verification
    numerator: abstained_cases
    denominator: labeled_cases
    undefined: 'null'
    note: All cases without a valid evidence-backed binary decision / all labeled cases; complements decision
      coverage.
  detection_precision:
    layer: detection
    numerator: detection_tp
    denominator: detection_tp + detection_fp
    undefined: 'null'
    note: 'Diagnostic only: matches to positives / all matches to labeled cases.'
  detection_recall:
    layer: detection
    numerator: detection_tp
    denominator: detection_tp + detection_fn
    undefined: 'null'
    note: 'Diagnostic only: detected positives / all labeled positives. Runtime failures cannot alter
      detection FN.'
  detection_f1:
    layer: detection
    numerator: 2 * detection_precision * detection_recall
    denominator: detection_precision + detection_recall
    undefined: 'null'
    note: N/A if precision or recall is undefined; 0 when both are defined and zero, otherwise harmonic
      mean.
  technical_failure_rate:
    layer: technical
    numerator: invalid_attempts
    denominator: all_attempts
    undefined: 'null'
    note: All TECHNICALLY_INVALID attempts / all attempts, including originals and retries; never silently
      discard failed attempts.
  severity_accuracy:
    layer: rubric
    numerator: correct_severity_labels
    denominator: assessed_severity_cases
    undefined: 'null'
    note: Only independently reviewed rubric labels and actual assessments; absence of labels or assessment
      means N/A.
  severity_assessed_coverage:
    layer: rubric
    numerator: assessed_severity_cases
    denominator: reviewed_severity_cases
    undefined: 'null'
    note: Actual assessments among independently reviewed severity cases; also report reviewed cases /
      all labeled cases.
  context_priority_accuracy:
    layer: rubric
    numerator: correct_context_labels
    denominator: assessed_context_cases
    undefined: 'null'
    note: Only independently reviewed Context Priority labels and actual assessments; no proxy labels.
  context_priority_assessed_coverage:
    layer: rubric
    numerator: assessed_context_cases
    denominator: reviewed_context_cases
    undefined: 'null'
    note: Actual assessments among independently reviewed Context Priority cases; also report reviewed
      cases / all labeled cases.
split:
  algorithm: sha256_seed_nul_group_uint256_threshold
  seed: cft-juice-shop-v2-a01-2026-10-11
  development_percent: 70
  group_field: independence_group
  assignment: development_if_hash_times_100_lt_70_times_2pow256_else_holdout
  encoding: utf8_exact_no_normalization
  freeze: before_tuning_no_score_based_reassignment
  families: report_actual_distribution_no_post_score_rebalancing
freeze:
  protocol: A01_raw_bytes_sha256
  dataset: A04_new_dataset_lock_no_overwrite
  scanners: A06
  changes: new_version_changelog_reason_new_digest_preserve_old_locks_and_results
  discovered_unknown: review_only_for_new_dataset_version
repeats:
  real_independent_runs: 3
  unchanged:
  - ground_truth
  - matching
  - split
  - target_commit
  - model
  - budgets
  - policies
  - scanner_configuration
  - producer_configuration
  retries: retain_attempt_reason_error_retry_of_never_silently_replace
  aggregate: valid_runs_only_report_attempts_failure_rate_and_na_counts
  independence: fresh_run_directory_and_reset_target_state_each_attempt

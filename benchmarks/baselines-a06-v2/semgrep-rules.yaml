- id: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
  languages:
  - yaml
  message: A `run:` step pipes the output of `curl` or `wget` directly into a shell
    interpreter. This is the "curl | bash" install pattern — if the remote server
    is compromised or the URL is hijacked, an attacker can execute arbitrary code
    in your CI runner. Consider downloading the file first, verifying its checksum
    or signature, and then executing it.
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    owasp:
    - A03:2021 - Injection

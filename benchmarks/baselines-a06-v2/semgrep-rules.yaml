    technology:
    - github-actions
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  patterns:
  - pattern-inside: "jobs:\n  ...\n"
  - pattern: 'secrets: inherit'

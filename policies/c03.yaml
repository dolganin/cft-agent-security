version: 1
targets:
  allowed:
  - registered
environments:
  allowed:
  - local
  - sandbox
  - staging
runtime:
  backend: process
  sandbox_image: example.invalid/cft-sandbox@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  network_mode: none
  internal_network: cft_internal_security_net
limits:
  max_iterations: 5
  executor:
    wall_time_seconds: 60
    cpu_time_seconds: 2
    memory_mb: 256
    max_file_bytes: 1048576
    max_processes: 8
    max_output_bytes: 32768
    max_runs_per_action: 1
    max_concurrent_runs: 1
tools:
  allowed:
  - fix_target_stage
  - verify_sql_injection
  - verify_redirect_destination
  parameter_contracts:
    verify_redirect_destination:
      allowed_keys:
      - artifact_id
      - line
      - check
      required_keys:
      - artifact_id
      - line
      - check
      enum_values:
        check:
        - redirect_destination
    fix_target_stage:
      allowed_keys:
      - adapter
      - stage
      required_keys:
      - adapter
      - stage
      enum_values:
        adapter:
        - juice_node_v1
        stage:
        - prepare
        - build
        - tests
        - start
        - smoke
        - c03_fixture
        - c03_source
        - c03_http
    verify_sql_injection:
      allowed_keys:
      - mode
      - artifact_id
      - line
      - check
      required_keys:
      - mode
      - artifact_id
      - line
      - check
      enum_values:
        mode:
        - authentication
        - search
logging:
  required: true

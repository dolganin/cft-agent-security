[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cft-security-agent"
version = "0.4.0"
description = "Contract-first starter architecture for a safe CI/CD security analysis agent."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6.0,<7",
  "langgraph>=0.2,<1",
  "fastapi>=0.115,<1",
  "starlette>=0.40,<0.42",
  "uvicorn>=0.30,<1",
  "tree-sitter==0.25.2",
  "tree-sitter-typescript==0.23.2",
  "cvss==3.6",
]

[project.scripts]
cft-security-pipeline = "app.pipeline_run:main"
cft-security-ci = "app.ci_pipeline:main"
cft-security-api = "api.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
]
sast = [
  "semgrep>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires local Docker and/or the trusted SberLab checkout",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# A06 code is hash-frozen; keep its legacy optional A05 import block byte-identical.
"evaluation/scanner_baseline.py" = ["I001"]
# Frozen A04 standalone CLI bootstraps sys.path before repository imports.
"benchmarks/juice-shop-v20.2.0/scorecard.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "app*",
    "pipeline*",
    "agent*",
    "architecture*",
    "discovery*",
    "evidence*",
    "executor*",
    "evaluation*",
    "fix_verification*",
    "pr_analysis*",
    "sast*",
    "schemas*",
    "scoring*",
    "reporting*",
    "security*",
    "tools*",
    "validator*",
]
exclude = [
    "tests*",
    "docs*",
    "targets*",
    "policies*",
]

[tool.setuptools.package-data]
executor = ["fix_test_reporter.mjs", "c03_test_reporter.mjs"]
